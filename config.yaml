theme_options:
  docusaurus:
    name: docusaurus
    lang_mapping:
      zh: zh-Hans
      en: en
  starlight:
    lang_mapping:
      zh: zh-cn
      en: en
  vitepress: {}
  nextra: {}
  hugo: {}
  hexo: {}
include: core/config/framework_adapters.yaml
seo_settings:
  enabled: true
  generate_description: true
  generate_keywords: true
image_settings:
  enabled: true
  process_images: true
  format: webp
  quality: 80
  max_width: 1400
  generate_alt: true
  deduplication: true
  base_url: /assets/
publish_control:
  exclude_patterns:
  - _drafts/*
  - .hidden/*
  webhook_enabled: false
  webhook_registry:
    feishu:
      id: feishu
      name: 飞书机器人
      description: 核心办公协作通知通道
    dingtalk:
      id: dingtalk
      name: 钉钉机器人
      description: 企业内部协同通知通道
    slack:
      id: slack
      name: Slack Bot
      description: Global team collaboration channel
    private_api:
      id: private_api
      name: 自建 API 通道
      description: 用户自定义的物理出版信号接收端
  append_credit: false
  credit_text: '


    ---

    *Powered by [Illacme-plenipes](https://github.com/Illacme/illacme-plenipes)*'
  direct_upload:
    cloudflare_pages:
      enabled: false
      api_token: YOUR_TOKEN
      account_id: YOUR_ACCOUNT
      project_name: YOUR_PROJECT
      branch: main
syndication:
  enabled: false
  timeout: 15.0
  devto:
    enabled: false
    api_key: YOUR_DEVTO_KEY
  medium:
    enabled: false
    token: ''
    author_id: ''
  hashnode:
    enabled: false
    token: ''
    publication_id: ''
  wordpress:
    enabled: false
    url: ''
    username: ''
    app_password: ''
  ghost:
    enabled: false
    url: ''
    admin_api_key: ''
  linkedin:
    enabled: false
    token: ''
    person_urn: ''
  universal_webhook:
    enabled: false
    url: ''
    auth_token: ''
timeline:
  enabled: true
  json_path: .plenipes/plenipes_timeline.json
  markdown_path: .plenipes/timeline.md
  max_entries: 1000
governance: {}
frontmatter_defaults:
  author: Your Name
frontmatter_order:
- title
- description
- keywords
- author
- date
- tags
- categories
version: '24.0'
