vault_root: /Users/eason/Documents/Obsidian Vault
metadata_db: .plenipes/ledger.json
active_theme: default
site_url: https://your-garden.com
lang_mapping:
  zh: zh-Hans
output_paths:
  markdown_dir: ./themes/{theme}/src/content/docs
  assets_dir: ./themes/{theme}/public/assets
  graph_json_dir: ./themes/{theme}/public
  source_dir: dist/{theme}/src
  static_dir: themes/default/static
  docs_dir: themes/default/{lang}/docs
  blog_dir: themes/default/{lang}/blog
  pages_dir: themes/default/{lang}/pages
system:
  data_root: imprints/titan_rift
  log_level: INFO
  verbose_ai_logs: true
  singleton_port: 43210
  max_workers: 8
  auto_save_interval: 2
  max_depth: 3
  enable_asset_audit: true
  network_settings:
    ignored_domains:
    - img.shields.io
    - github-readme-stats.vercel.app
    - wakatime.com
  watchdog_settings:
    exclude_dirs:
    - .git
    - node_modules
    - .plenipes
    - themes
    heavy_task_delay: 0.8
    gc_delay: 5.0
  janitor_settings:
    global_exclude:
    - .git
    - node_modules
    - dist
    - .docusaurus
    theme_exclude:
      docusaurus:
      - .docusaurus
      - build
      starlight:
      - .astro
      - node_modules
  ai_context_purification:
    strip_styles: true
    strip_mdx_imports: true
    strip_comments: true
    strip_code_blocks: true
    strip_jsx_tags: true
ingress_settings:
  active_dialects:
  - auto
  staticize_components: true
  hard_line_break: false
  custom_sanitizers: {}
i18n_settings:
  source:
    lang_code: zh
    name: 简体中文
  targets:
  - lang_code: en
    name: English
    translate_body: true
    translate_title: true
translation:
  strategy: single
  primary_node: lmstudio_local
  fallback_node: ollama_local
  providers:
    deepseek_api:
      type: openai-compatible
      model: deepseek-chat
      api_key: ${DEEPSEEK_API_KEY}
      base_url: https://api.deepseek.com/v1
    lmstudio_local:
      type: lmstudio
      base_url: http://localhost:1234/v1
      model: gpt-4o-mini
    ollama_local:
      type: ollama
      model: llama3
      base_url: http://127.0.0.1:11434/api
    mistral_node:
      type: mistral
      base_url: https://api.mistral.ai/v1
      model: gpt-4o-mini
    v1_node:
      type: v1
      base_url: https://api.together.xyz/v1
      model: gpt-4o-mini
    openai_node:
      type: openai
      base_url: https://api.openai.com/v1
      model: gpt-4o-mini
    openrouter_node:
      type: openrouter
      base_url: https://openrouter.ai/api/v1
      model: gpt-4o-mini
    azure_node:
      type: azure
      base_url: https://api.openai.com/v1
      model: gpt-4o-mini
    siliconflow_node:
      type: siliconflow
      base_url: https://api.siliconflow.cn/v1
      model: gpt-4o-mini
    google_node:
      type: google
      base_url: https://generativelanguage.googleapis.com/v1beta
      model: gpt-4o-mini
    groq_node:
      type: groq
      base_url: https://api.groq.com/openai/v1
      model: gpt-4o-mini
    deepseek_node:
      type: deepseek
      base_url: https://api.deepseek.com
      model: gpt-4o-mini
    anthropic_node:
      type: anthropic
      base_url: https://api.anthropic.com/v1
      model: gpt-4o-mini
    together_node:
      type: together
      base_url: https://api.together.xyz/v1
      model: gpt-4o-mini
    cohere_node:
      type: cohere
      base_url: https://api.cohere.ai/v1
      model: gpt-4o-mini
    mock_node:
      type: mock
      base_url: http://localhost:0
      model: gpt-4o-mini
    gemini_node:
      type: gemini
      base_url: https://generativelanguage.googleapis.com/v1beta
      model: gpt-4o-mini
  llm_concurrency: 1
  api_timeout: 600.0
  max_retries: 3
  temperature: 0.2
  max_tokens: 8192
  max_chunk_size: 2500
  empty_content_threshold: 15
  max_slug_length: 100
  max_seo_description_length: 200
  global_proxy: ''
  custom_prompts:
    slug: You are an SEO expert. Generate a URL-safe, lowercase, SEO-friendly English
      slug for the given title. Return ONLY the slug string.
    seo: You are an SEO expert. Analyze the text and provide a JSON with 'description'
      and 'keywords'.
  resilience: {}
  include: core/config/compute_nodes.yaml
  compute_nodes:
    moonshot_node:
      id: moonshot_node
      type: moonshot
      base_url: https://api.moonshot.cn/v1
    openai-compatible_node:
      id: openai-compatible_node
      type: openai-compatible
      base_url: https://api.openai.com/v1
    v1_node:
      id: v1_node
      type: v1
      base_url: https://api.openai.com/v1
    openai_node:
      id: openai_node
      type: openai
      base_url: https://api.openai.com/v1
    mistral_node:
      id: mistral_node
      type: mistral
      base_url: https://api.mistral.ai/v1
    mistral-openai_node:
      id: mistral-openai_node
      type: mistral-openai
      base_url: https://api.mistral.ai/v1
    minimax_node:
      id: minimax_node
      type: minimax
      base_url: https://api.minimax.chat/v1
    volcengine_node:
      id: volcengine_node
      type: volcengine
      base_url: https://ark.cn-beijing.volces.com/api/v3
    lmstudio_local:
      id: lmstudio_local
      type: lmstudio
      base_url: http://localhost:1234/v1
    lmstudio-v1_node:
      id: lmstudio-v1_node
      type: lmstudio-v1
      base_url: http://localhost:1234/v1
    lmstudio-openai_node:
      id: lmstudio-openai_node
      type: lmstudio-openai
      base_url: http://localhost:1234/v1
    generic_node:
      id: generic_node
      type: generic
      base_url: ''
    openrouter_node:
      id: openrouter_node
      type: openrouter
      base_url: https://openrouter.ai/api/v1
    azure_node:
      id: azure_node
      type: azure
      base_url: https://{resource}.openai.azure.com/openai/deployments/{deployment_name}
    localai_node:
      id: localai_node
      type: localai
      base_url: http://localhost:8080/v1
    siliconflow_node:
      id: siliconflow_node
      type: siliconflow
      base_url: https://api.siliconflow.cn/v1
    zhipu_node:
      id: zhipu_node
      type: zhipu
      base_url: https://open.bigmodel.cn/api/paas/v4
    perplexity_node:
      id: perplexity_node
      type: perplexity
      base_url: https://api.perplexity.ai
    gemini_node:
      id: gemini_node
      type: gemini
      base_url: ''
    gemini-v1_node:
      id: gemini-v1_node
      type: gemini-v1
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
    gemini-openai_node:
      id: gemini-openai_node
      type: gemini-openai
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
    dashscope_node:
      id: dashscope_node
      type: dashscope
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    groq_node:
      id: groq_node
      type: groq
      base_url: https://api.groq.com/openai/v1
    deepseek-r1_node:
      id: deepseek-r1_node
      type: deepseek-r1
      base_url: https://api.deepseek.com
    deepseek_node:
      id: deepseek_node
      type: deepseek
      base_url: https://api.deepseek.com
    anthropic_node:
      id: anthropic_node
