vault_root: /Users/eason/Documents/Obsidian Vault
metadata_db: .plenipes/ledger.json
active_theme: default
site_url: https://your-garden.com
lang_mapping:
  zh: zh-Hans
output_paths:
  markdown_dir: ./themes/{theme}/src/content/docs
  assets_dir: dist/{theme}/assets
  graph_json_dir: metadata/{theme}/graph
  source_dir: dist/{theme}/src
  static_dir: dist/{theme}/static
route_matrix:
- source: Index
  prefix: ''
- source: Blog
  prefix: blog
- source: Docs
  prefix: docs
system:
  data_root: imprints/ivory_rift
  log_level: INFO
  verbose_ai_logs: true
  singleton_port: 43210
  max_workers: 8
  auto_save_interval: 2
  max_depth: 3
  enable_asset_audit: true
  network_settings:
    ignored_domains:
    - img.shields.io
    - github-readme-stats.vercel.app
    - wakatime.com
  watchdog_settings:
    exclude_dirs:
    - .git
    - node_modules
    - .plenipes
    - themes
    heavy_task_delay: 0.8
    gc_delay: 5.0
  janitor_settings:
    global_exclude:
    - .git
    - node_modules
    - dist
    - .docusaurus
    theme_exclude:
      docusaurus:
      - .docusaurus
      - build
      starlight:
      - .astro
      - node_modules
  ai_context_purification:
    strip_styles: true
    strip_mdx_imports: true
    strip_comments: true
    strip_code_blocks: true
    strip_jsx_tags: true
ingress_settings:
  active_dialects:
  - auto
  staticize_components: true
  hard_line_break: false
  custom_sanitizers: {}
i18n_settings:
  source:
    lang_code: zh
    name: 简体中文
  targets:
  - lang_code: en
    name: English
    translate_body: true
    translate_title: true
translation:
  strategy: fallback
  primary_node: lmstudio_local
  fallback_node: ollama_local
  providers:
    deepseek_api:
      type: openai-compatible
      model: deepseek-chat
      api_key: ${DEEPSEEK_API_KEY}
      base_url: https://api.deepseek.com/v1
    lmstudio_local:
      type: lmstudio
      base_url: http://localhost:1234/v1
      model: gpt-4o-mini
    ollama_local:
      type: ollama
      model: llama3
      base_url: http://127.0.0.1:11434/api
    mistral_node:
      type: mistral
      base_url: https://api.mistral.ai/v1
      model: gpt-4o-mini
    v1_node:
      type: v1
      base_url: https://api.together.xyz/v1
      model: gpt-4o-mini
    openai_node:
      type: openai
      base_url: https://api.openai.com/v1
      model: gpt-4o-mini
    openrouter_node:
      type: openrouter
      base_url: https://openrouter.ai/api/v1
      model: gpt-4o-mini
    azure_node:
      type: azure
      base_url: https://api.openai.com/v1
      model: gpt-4o-mini
    siliconflow_node:
      type: siliconflow
      base_url: https://api.siliconflow.cn/v1
      model: gpt-4o-mini
    google_node:
      type: google
      base_url: https://generativelanguage.googleapis.com/v1beta
      model: gpt-4o-mini
    groq_node:
      type: groq
      base_url: https://api.groq.com/openai/v1
      model: gpt-4o-mini
    deepseek_node:
      type: deepseek
      base_url: https://api.deepseek.com
      model: gpt-4o-mini
    anthropic_node:
      type: anthropic
      base_url: https://api.anthropic.com/v1
      model: gpt-4o-mini
    together_node:
      type: together
      base_url: https://api.together.xyz/v1
      model: gpt-4o-mini
    cohere_node:
      type: cohere
      base_url: https://api.cohere.ai/v1
      model: gpt-4o-mini
    mock_node:
      type: mock
      base_url: http://localhost:0
      model: gpt-4o-mini
    gemini_node:
      type: gemini
      base_url: https://generativelanguage.googleapis.com/v1beta
      model: gpt-4o-mini
  llm_concurrency: 1
  api_timeout: 600.0
  max_retries: 3
  temperature: 0.2
  max_tokens: 8192
  max_chunk_size: 2500
  empty_content_threshold: 15
  max_slug_length: 100
  max_seo_description_length: 200
  global_proxy: ''
  custom_prompts:
    slug: You are an SEO expert. Generate a URL-safe, lowercase, SEO-friendly English
      slug for the given title. Return ONLY the slug string.
    seo: You are an SEO expert. Analyze the text and provide a JSON with 'description'
      and 'keywords'.
  resilience: {}
theme_options:
  docusaurus:
    name: docusaurus
    lang_mapping:
      zh: zh-Hans
      en: en
  starlight:
    lang_mapping:
      zh: zh-cn
      en: en
  vitepress: {}
  nextra: {}
  hugo: {}
  hexo: {}
framework_adapters:
  starlight:
    callout_template: '

      :::{type} {title}

      {body}

      :::


      '
    type_mapping:
      info: note
      abstract: note
      success: tip
      warning: caution
      danger: danger
  vitepress:
    callout_template: '

      :::{type} {title}

      {body}

      :::


      '
    type_mapping:
      note: info
      tip: tip
      warning: warning
      danger: danger
  docusaurus:
    callout_template: '

      :::{type} {title}

      {body}

      :::


      '
    type_mapping:
      note: note
      info: info
      success: tip
      warning: warning
      danger: danger
    component_mappings:
      CardGrid: '{children}'
      Card: '### {title}


        {children}


        '
  nextra:
    callout_template: '

      <Callout type="{type}">

      **{title}**

      {body}

      </Callout>


      '
    type_mapping:
      note: default
      info: info
      warning: warning
      danger: error
  hugo:
    callout_template: '

      {{{{< admonition type="{type}" title="{title}" >}}}}

      {body}

      {{{{< /admonition >}}}}


      '
    type_mapping:
      note: note
      tip: tip
      warning: warning
  hexo:
    callout_template: '

      {{{{% note {type} %}}}}

      **{title}**

      {body}

      {{{{% endnote %}}}}


      '
    type_mapping:
      note: default
      info: info
      warning: warning
seo_settings:
  enabled: true
  generate_description: true
  generate_keywords: true
image_settings:
  enabled: true
  process_images: true
  format: webp
  quality: 80
  max_width: 1400
  generate_alt: true
  deduplication: true
  base_url: /assets/
publish_control:
  exclude_patterns:
  - _drafts/*
  - .hidden/*
  webhook_enabled: false
  webhook_registry:
    feishu:
      id: feishu
      name: 飞书机器人
      description: 核心办公协作通知通道
    dingtalk:
      id: dingtalk
      name: 钉钉机器人
      description: 企业内部协同通知通道
    slack:
      id: slack
      name: Slack Bot
      description: Global team collaboration channel
    private_api:
      id: private_api
      name: 自建 API 通道
      description: 用户自定义的物理出版信号接收端
  append_credit: false
  credit_text: '


    ---

    *Powered by [Illacme-plenipes](https://github.com/Illacme/illacme-plenipes)*'
  direct_upload:
    cloudflare_pages:
      enabled: false
      api_token: YOUR_TOKEN
      account_id: YOUR_ACCOUNT
      project_name: YOUR_PROJECT
      branch: main
syndication:
  enabled: false
  timeout: 15.0
  devto:
    enabled: false
    api_key: YOUR_DEVTO_KEY
  medium:
    enabled: false
    token: ''
    author_id: ''
  hashnode:
    enabled: false
    token: ''
    publication_id: ''
  wordpress:
    enabled: false
    url: ''
    username: ''
    app_password: ''
  ghost:
    enabled: false
    url: ''
    admin_api_key: ''
  linkedin:
    enabled: false
    token: ''
    person_urn: ''
  universal_webhook:
    enabled: false
    url: ''
    auth_token: ''
timeline:
  enabled: true
  json_path: .plenipes/plenipes_timeline.json
  markdown_path: .plenipes/timeline.md
  max_entries: 1000
governance: {}
frontmatter_defaults:
  author: Your Name
frontmatter_order:
- title
- description
- keywords
- author
- date
- tags
- categories
version: '24.0'
