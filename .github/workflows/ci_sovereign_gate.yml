name: Sovereign CI Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  audit-and-test:
    name: 🛡️ 主权合规审计与测试门禁
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 挂载 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🟢 挂载 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 安装核心依赖与测试套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest anyio ruff reportlab httpx

      - name: 🔍 核心引擎代码规范审计 (Ruff Linting)
        run: |
          ruff check core/ services/ --extend-exclude core/ui/handlers/status_handlers.py

      - name: 🧪 装帧与电子书核心测试套件
        run: |
          pytest tests/test_ebook_*.py tests/test_bindery_*.py
