name: Build Desktop Application

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否自动发布至 GitHub Releases'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release 标签 (例如 v1.0.0，留空则使用当前日期)'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build-desktop:
    name: 📦 打包 ${{ matrix.os-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows (x64)
            artifact-name: Illacme-Plenipes-Windows-x64.zip
          - os: macos-14
            os-name: macOS (Apple Silicon arm64)
            artifact-name: Illacme-Plenipes-macOS-AppleSilicon-arm64.zip
          - os: ubuntu-latest
            os-name: Linux (x64)
            artifact-name: Illacme-Plenipes-Linux-x64.tar.gz

    permissions:
      contents: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 挂载 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 安装核心依赖与打包工具链
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: 🔨 启动自动化打包流水线
        run: |
          python -c "from desktop.packager import DesktopPackager; import sys; sys.exit(0 if DesktopPackager.execute_build() else 1)"

      - name: 🔍 检查编译产物拓扑
        shell: bash
        run: |
          echo "=== 产物目录结构 ==="
          ls -la dist/desktop/

      - name: 🗜️ 压缩归档打包产物 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/desktop/* -DestinationPath ${{ matrix.artifact-name }} -Force
          Get-Item ${{ matrix.artifact-name }} | Select-Object Name, Length

      - name: 🗜️ 压缩归档打包产物 (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist/desktop
          zip -r -y ../../${{ matrix.artifact-name }} Illacme-Plenipes.app README_使用说明.txt
          cd ../..
          ls -lh ${{ matrix.artifact-name }}

      - name: 🗜️ 压缩归档打包产物 (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf ${{ matrix.artifact-name }} -C dist/desktop Illacme-Plenipes README_使用说明.txt
          ls -lh ${{ matrix.artifact-name }}

      - name: 🔏 计算发布产物 SHA256 校验和
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact-name }}" > "${{ matrix.artifact-name }}.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${{ matrix.artifact-name }}" > "${{ matrix.artifact-name }}.sha256"
          fi
          echo "=== SHA256 校验和 ==="
          cat "${{ matrix.artifact-name }}.sha256"

      - name: 📤 上传构建产物 (GitHub Actions Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ${{ matrix.artifact-name }}
            ${{ matrix.artifact-name }}.sha256
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: 🚀 聚合发布至 GitHub Releases
    needs: [build-desktop]
    runs-on: ubuntu-latest
    if: github.event.inputs.create_release == 'true' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ 计算 Release 标签
        id: vars
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(date +'%Y.%m.%d')"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: 📥 下载全平台构建产物
        uses: actions/download-artifact@v4
        with:
          path: release_assets/
          merge-multiple: true

      - name: 📝 自动提取并生成结构化更新日志 (Changelog)
        shell: bash
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || git describe --tags --abbrev=0 2>/dev/null || "")

          echo "### 📦 资产下载与完整性校验" > release_body.md
          echo "" >> release_body.md
          echo "| 操作系统平台 | 安装包名称 | SHA256 校验文件 |" >> release_body.md
          echo "| :--- | :--- | :--- |" >> release_body.md
          echo "| 🪟 Windows (x64) | \`Illacme-Plenipes-Windows-x64.zip\` | \`Illacme-Plenipes-Windows-x64.zip.sha256\` |" >> release_body.md
          echo "| 🍎 macOS (Apple Silicon) | \`Illacme-Plenipes-macOS-AppleSilicon-arm64.zip\` | \`Illacme-Plenipes-macOS-AppleSilicon-arm64.zip.sha256\` |" >> release_body.md
          echo "| 🐧 Linux (x64) | \`Illacme-Plenipes-Linux-x64.tar.gz\` | \`Illacme-Plenipes-Linux-x64.tar.gz.sha256\` |" >> release_body.md
          echo "" >> release_body.md
          echo "### ✨ 本次更新内容 (What's New)" >> release_body.md
          echo "" >> release_body.md

          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            git log --pretty=format:"* %s (%h)" "$PREV_TAG..$TAG" >> release_body.md
            echo "" >> release_body.md
            echo "" >> release_body.md
            echo "**完整变更对比**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}" >> release_body.md
          else
            git log -n 25 --pretty=format:"* %s (%h)" "$TAG" >> release_body.md
          fi

          echo "=== 预览 RELEASE 说明 ==="
          cat release_body.md

      - name: 🚀 统一发布 Release 资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Illacme Plenipes ${{ steps.vars.outputs.tag }}"
          body_path: release_body.md
          files: |
            release_assets/*
          draft: false
          prerelease: false
