name: Build Desktop Application

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否自动发布至 GitHub Releases'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release 标签 (例如 v1.0.0，留空则使用当前日期)'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build-desktop:
    name: 📦 打包 ${{ matrix.os-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows (x64)
            asset-suffix: Windows-x64
            target-arch: ''
          - os: macos-14
            os-name: macOS (Apple Silicon)
            asset-suffix: macOS
            target-arch: ''
          - os: ubuntu-24.04
            os-name: Linux (x64)
            asset-suffix: Linux-x64
            target-arch: ''

    permissions:
      contents: write

    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 挂载 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 安装核心依赖与打包工具链
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow
          if [ "${{ runner.os }}" != "Linux" ]; then
            pip install pystray pywebview
          fi

      - name: 🔨 启动自动化打包流水线
        shell: bash
        run: |
          ARGS=""
          if [ -n "${{ matrix.target-arch }}" ]; then
            ARGS="--target-arch ${{ matrix.target-arch }}"
          fi
          python desktop/packager.py $ARGS

      - name: 🔍 检查编译产物拓扑
        shell: bash
        run: |
          echo "=== 产物目录结构 ==="
          ls -la dist/desktop/

      - name: 🗜️ 制作发布产物 (Windows 便携包 & 原生安装向导)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 1. 便携压缩包 (ZIP)
          Compress-Archive -Path dist/desktop/* -DestinationPath Illacme-Plenipes-Windows-x64.zip -Force
          Get-Item Illacme-Plenipes-Windows-x64.zip | Select-Object Name, Length
          
          # 2. 原生 Inno Setup 安装向导 (Setup.exe)
          try {
            choco install innosetup -y --no-progress
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $isccPath) {
              & $isccPath desktop/inno_setup.iss
              if (Test-Path Illacme-Plenipes-Windows-x64-Setup.exe) {
                Get-Item Illacme-Plenipes-Windows-x64-Setup.exe | Select-Object Name, Length
              }
            }
          } catch {
            Write-Warning "Inno Setup installer compilation skipped: $_"
          }

      - name: 🗜️ 制作发布产物 (macOS 便携包 & 原生 DMG 镜像)
        if: runner.os == 'macOS'
        run: |
          # 1. 便携压缩包 (ZIP)
          cd dist/desktop
          zip -r -y ../../Illacme-Plenipes-${{ matrix.asset-suffix }}.zip Illacme-Plenipes.app README_使用说明.txt 双击修复无法打开.command 2>/dev/null || zip -r -y ../../Illacme-Plenipes-${{ matrix.asset-suffix }}.zip Illacme-Plenipes.app README_使用说明.txt
          cd ../..
          ls -lh Illacme-Plenipes-${{ matrix.asset-suffix }}.zip
          
          # 2. 原生 DMG 拖拽安装镜像 (hdiutil)
          echo "=== 制作 macOS 原生 DMG 镜像 (${{ matrix.asset-suffix }}) ==="
          mkdir -p dmg_root
          cp -R dist/desktop/Illacme-Plenipes.app dmg_root/
          ln -s /Applications dmg_root/Applications
          cp dist/desktop/README_使用说明.txt dmg_root/
          if [ -f dist/desktop/双击修复无法打开.command ]; then
            cp dist/desktop/双击修复无法打开.command dmg_root/
            chmod +x dmg_root/双击修复无法打开.command
          fi
          hdiutil create -volname "Illacme Plenipes" -srcfolder dmg_root -ov -format UDZO Illacme-Plenipes-${{ matrix.asset-suffix }}.dmg
          rm -rf dmg_root
          ls -lh Illacme-Plenipes-${{ matrix.asset-suffix }}.dmg

      - name: 🗜️ 制作发布产物 (Linux 原生归档)
        if: runner.os == 'Linux'
        run: |
          tar -czf Illacme-Plenipes-Linux-x64.tar.gz -C dist/desktop Illacme-Plenipes README_使用说明.txt
          ls -lh Illacme-Plenipes-Linux-x64.tar.gz

      - name: 🔏 计算发布产物 SHA256 校验和
        shell: bash
        run: |
          for f in Illacme-Plenipes-*; do
            if [ -f "$f" ] && [[ "$f" != *.sha256 ]]; then
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$f" > "$f.sha256"
              elif command -v shasum >/dev/null 2>&1; then
                shasum -a 256 "$f" > "$f.sha256"
              fi
              echo "=== $f.sha256 ==="
              cat "$f.sha256"
            fi
          done

      - name: 📤 上传构建产物 (GitHub Actions Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            Illacme-Plenipes-*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: 🚀 聚合发布至 GitHub Releases
    needs: [build-desktop]
    runs-on: ubuntu-24.04
    if: github.event.inputs.create_release == 'true' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ 计算 Release 标签
        id: vars
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(date +'%Y.%m.%d')"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: 📥 下载全平台构建产物
        uses: actions/download-artifact@v4
        with:
          path: release_assets/
          merge-multiple: true

      - name: 📝 自动提取并生成结构化更新日志 (Changelog)
        shell: bash
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          RELEASE_DOC="docs/releases/${TAG}.md"

          if [ -f "$RELEASE_DOC" ]; then
            echo "📄 发现仓库已存在专属发版文档: $RELEASE_DOC，直接作为 Release 正文..."
            cp "$RELEASE_DOC" release_body.md
          else
            echo "🤖 未检测到手写发版文档，正在触发 ReleaseNotesBuilder 自动化生成面向创作者的 Markdown..."
            python desktop/release_notes_builder.py --version "$TAG" --output release_body.md
          fi

          echo "=== 预览 RELEASE 说明 ==="
          cat release_body.md


      - name: 🚀 统一发布 Release 资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Illacme Plenipes ${{ steps.vars.outputs.tag }}"
          body_path: release_body.md
          files: |
            release_assets/*
          draft: false
          prerelease: false
