name: 🖥️ Build Desktop Application

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否自动发布至 GitHub Releases'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release 标签 (例如 v1.0.0，留空则使用当前日期)'
        required: false
        type: string
        default: ''
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/build_desktop.yml'
    tags:
      - 'v*'

jobs:
  build-desktop:
    name: 📦 打包 ${{ matrix.os-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows
            artifact-name: Illacme-Plenipes-Windows-x64.zip
          - os: macos-latest
            os-name: macOS
            artifact-name: Illacme-Plenipes-macOS.zip

    permissions:
      contents: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 挂载 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 安装核心依赖与打包工具链
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: 🔨 启动自动化打包流水线
        run: |
          python scripts/build_desktop.py

      - name: 🔍 检查编译产物拓扑
        shell: bash
        run: |
          echo "=== 产物目录结构 ==="
          ls -la dist/desktop/

      - name: 🗜️ 压缩归档打包产物 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/desktop/* -DestinationPath ${{ matrix.artifact-name }} -Force
          Get-Item ${{ matrix.artifact-name }} | Select-Object Name, Length

      - name: 🗜️ 压缩归档打包产物 (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist/desktop
          zip -r -y ../../${{ matrix.artifact-name }} Illacme-Plenipes.app
          cd ../..
          ls -lh ${{ matrix.artifact-name }}

      - name: 📤 上传构建产物 (GitHub Actions Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}
          if-no-files-found: error
          retention-days: 14

      - name: 🏷️ 计算 Release 标签
        id: vars
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 发布至 GitHub Releases
        if: github.event.inputs.create_release == 'true' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Illacme Plenipes 独立桌面客户端 ${{ steps.vars.outputs.tag }}"
          files: ${{ matrix.artifact-name }}
          draft: false
          prerelease: false
          generate_release_notes: true
