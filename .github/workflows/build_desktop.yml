name: Build Desktop Application

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否自动发布至 GitHub Releases'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release 标签 (例如 v1.0.0，留空则使用当前日期)'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build-desktop:
    name: 📦 打包 ${{ matrix.os-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows (x64)
            asset-suffix: Windows-x64
            target-arch: ''
          - os: macos-14
            os-name: macOS (Apple Silicon)
            asset-suffix: macOS
            target-arch: ''
          - os: ubuntu-24.04
            os-name: Linux (x64)
            asset-suffix: Linux-x64
            target-arch: ''

    permissions:
      contents: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 挂载 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 安装核心依赖与打包工具链
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow
          if [ "${{ runner.os }}" != "Linux" ]; then
            pip install pystray pywebview
          fi

      - name: 🔨 启动自动化打包流水线
        run: |
          python -c "from desktop.packager import DesktopPackager; import sys; arch = '${{ matrix.target-arch }}' or None; sys.exit(0 if DesktopPackager.execute_build(target_arch=arch) else 1)"

      - name: 🔍 检查编译产物拓扑
        shell: bash
        run: |
          echo "=== 产物目录结构 ==="
          ls -la dist/desktop/

      - name: 🗜️ 制作发布产物 (Windows 便携包 & 原生安装向导)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 1. 便携压缩包 (ZIP)
          Compress-Archive -Path dist/desktop/* -DestinationPath Illacme-Plenipes-Windows-x64.zip -Force
          Get-Item Illacme-Plenipes-Windows-x64.zip | Select-Object Name, Length
          
          # 2. 原生 Inno Setup 安装向导 (Setup.exe)
          try {
            choco install innosetup -y --no-progress
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $isccPath) {
              & $isccPath desktop/inno_setup.iss
              if (Test-Path Illacme-Plenipes-Windows-x64-Setup.exe) {
                Get-Item Illacme-Plenipes-Windows-x64-Setup.exe | Select-Object Name, Length
              }
            }
          } catch {
            Write-Warning "Inno Setup installer compilation skipped: $_"
          }

      - name: 🗜️ 制作发布产物 (macOS 便携包 & 原生 DMG 镜像)
        if: runner.os == 'macOS'
        run: |
          # 1. 便携压缩包 (ZIP)
          cd dist/desktop
          zip -r -y ../../Illacme-Plenipes-${{ matrix.asset-suffix }}.zip Illacme-Plenipes.app README_使用说明.txt 双击修复无法打开.command 2>/dev/null || zip -r -y ../../Illacme-Plenipes-${{ matrix.asset-suffix }}.zip Illacme-Plenipes.app README_使用说明.txt
          cd ../..
          ls -lh Illacme-Plenipes-${{ matrix.asset-suffix }}.zip
          
          # 2. 原生 DMG 拖拽安装镜像 (hdiutil)
          echo "=== 制作 macOS 原生 DMG 镜像 (${{ matrix.asset-suffix }}) ==="
          mkdir -p dmg_root
          cp -R dist/desktop/Illacme-Plenipes.app dmg_root/
          ln -s /Applications dmg_root/Applications
          cp dist/desktop/README_使用说明.txt dmg_root/
          if [ -f dist/desktop/双击修复无法打开.command ]; then
            cp dist/desktop/双击修复无法打开.command dmg_root/
            chmod +x dmg_root/双击修复无法打开.command
          fi
          hdiutil create -volname "Illacme Plenipes" -srcfolder dmg_root -ov -format UDZO Illacme-Plenipes-${{ matrix.asset-suffix }}.dmg
          rm -rf dmg_root
          ls -lh Illacme-Plenipes-${{ matrix.asset-suffix }}.dmg

      - name: 🗜️ 制作发布产物 (Linux 原生归档)
        if: runner.os == 'Linux'
        run: |
          tar -czf Illacme-Plenipes-Linux-x64.tar.gz -C dist/desktop Illacme-Plenipes README_使用说明.txt
          ls -lh Illacme-Plenipes-Linux-x64.tar.gz

      - name: 🔏 计算发布产物 SHA256 校验和
        shell: bash
        run: |
          for f in Illacme-Plenipes-*; do
            if [ -f "$f" ] && [[ "$f" != *.sha256 ]]; then
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$f" > "$f.sha256"
              elif command -v shasum >/dev/null 2>&1; then
                shasum -a 256 "$f" > "$f.sha256"
              fi
              echo "=== $f.sha256 ==="
              cat "$f.sha256"
            fi
          done

      - name: 📤 上传构建产物 (GitHub Actions Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            Illacme-Plenipes-*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: 🚀 聚合发布至 GitHub Releases
    needs: [build-desktop]
    runs-on: ubuntu-24.04
    if: github.event.inputs.create_release == 'true' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ 计算 Release 标签
        id: vars
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(date +'%Y.%m.%d')"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: 📥 下载全平台构建产物
        uses: actions/download-artifact@v4
        with:
          path: release_assets/
          merge-multiple: true

      - name: 📝 自动提取并生成结构化更新日志 (Changelog)
        shell: bash
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || git describe --tags --abbrev=0 2>/dev/null || "")
          RELEASE_DOC="docs/releases/${TAG}.md"

          if [ -f "$RELEASE_DOC" ]; then
            echo "📄 发现专属发版通告文档: $RELEASE_DOC，正在作为 Release 正文..."
            cp "$RELEASE_DOC" release_body.md
          else
            echo "### 📦 官方客户端下载与安装方式 / Official Downloads" > release_body.md
            echo "" >> release_body.md
            echo "| 操作系统平台 / OS | 安装格式 / Format | 下载文件 / Asset | 推荐场景 / Best For |" >> release_body.md
            echo "| :--- | :--- | :--- | :--- |" >> release_body.md
            echo "| 🍎 **macOS (Apple Silicon)** | **原装 DMG 镜像** | \`Illacme-Plenipes-macOS.dmg\` | **首选 / Recommended**：Apple Silicon (M1/M2/M3/M4) Mac |" >> release_body.md
            echo "| 🍎 macOS (Apple Silicon) | 便携 ZIP 压缩包 | \`Illacme-Plenipes-macOS.zip\` | 免挂载解压即用 / Portable archive |" >> release_body.md
            echo "| 🪟 **Windows (x64)** | **一键安装向导 (Setup)** | \`Illacme-Plenipes-Windows-x64-Setup.exe\` | **首选 / Recommended**：标准向导安装、自动创建桌面图标 |" >> release_body.md
            echo "| 🪟 Windows (x64) | 便携 ZIP 压缩包 | \`Illacme-Plenipes-Windows-x64.zip\` | 免安装纯便携版 / Portable archive |" >> release_body.md
            echo "| 🐧 **Linux (x64)** | 原生独立可执行归档 | \`Illacme-Plenipes-Linux-x64.tar.gz\` | Linux 桌面与服务器直接运行 / Linux desktop & server |" >> release_body.md
            echo "" >> release_body.md
            echo "> 💡 **完整性保障 / Integrity**：每个安装文件均附带对应的 \`.sha256\` 校验文件。" >> release_body.md
            echo "" >> release_body.md
            echo "### 🛡️ 首次运行安全提示 / First-Run Security Unlock (3 Seconds)" >> release_body.md
            echo "" >> release_body.md
            echo "* **🍎 macOS 首次运行提示“已损坏，无法打开” / \"App is damaged\"**：" >> release_body.md
            echo "  * **方案 A（一键自动修复，推荐）**：在安装包中直接**双击运行「双击修复无法打开.command」**脚本即可自动解除隔离。" >> release_body.md
            echo "  * **Option A (Auto-fix)**: Double-click the bundled \`双击修复无法打开.command\` script in the package." >> release_body.md
            echo "  * **方案 B（终端一键直达）**：在终端运行 \`xattr -cr /Applications/Illacme-Plenipes.app\`。" >> release_body.md
            echo "* **🪟 Windows 蓝色保护警告 / Windows Defender SmartScreen**：" >> release_body.md
            echo "  * 点击「更多信息」，再点击「仍要运行」即可正常启动。" >> release_body.md
            echo "  * Click \"More info\", then click \"Run anyway\"." >> release_body.md
            echo "" >> release_body.md
            echo "### ✨ 本次更新内容 / What's New" >> release_body.md
            echo "" >> release_body.md

            if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
              git log --pretty=format:"* %s (%h)" "$PREV_TAG..$TAG" >> release_body.md
              echo "" >> release_body.md
              echo "" >> release_body.md
              echo "**完整变更对比**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}" >> release_body.md
            else
              git log -n 25 --pretty=format:"* %s (%h)" "$TAG" >> release_body.md
            fi
          fi

          echo "=== 预览 RELEASE 说明 ==="
          cat release_body.md


      - name: 🚀 统一发布 Release 资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Illacme Plenipes ${{ steps.vars.outputs.tag }}"
          body_path: release_body.md
          files: |
            release_assets/*
          draft: false
          prerelease: false
