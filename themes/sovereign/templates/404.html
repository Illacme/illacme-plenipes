<!DOCTYPE html>
<html lang="{{ lang_code | default('zh') }}" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到 | {{ site_name }}</title>
    <meta name="description" content="抱歉，您访问的出版资产或页面不存在或已被迁移。">

    <!-- ⚡ Anti-FOUC 早期主题注入 -->
    <script>
        (function () {
            var savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <!-- 🎨 自定义样式与视觉特效热配置注入 -->
    {{ custom_theme_styles }}

    <!-- 🏗️ 字体系统本地主权注入 -->
    <link rel="stylesheet" href="{{ root_path }}static/css/fonts.css">

    <!-- 🏗️ 主权视觉系统物理注入 -->
    <link rel="stylesheet" href="{{ root_path }}static/css/style.css?v=16.0">
    <link rel="icon" type="image/png" href="{{ root_path }}favicon.png">
</head>

<body class="sovereign-engine layout-404" data-root-path="{{ root_path }}">

    <!-- 🌐 顶部全息导航 (Glassmorphism) -->
    <header class="glass-header">
        <div class="header-container">
            <div class="header-left">
                <a href="{{ nav_home_url }}" class="logo-group">
                    {{ logo_html }}
                    <span class="logo-text">{{ site_name }}</span>
                </a>
                <nav class="desktop-nav">
                    {{ main_nav_container }}
                </nav>
            </div>

            <div class="header-right">
                <div class="action-hub">
                    {{ github_link_container }}
                    <button id="theme-toggle" class="control-btn theme-btn" title="切换模式">
                        <span class="btn-icon">☀️</span>
                        <span class="btn-label">Light</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="main-layout layout-404">
        <main class="content-gate">
            <div class="error-hero">
                <div class="error-code">404</div>
                <h1 class="error-title" style="font-size: 2rem; margin-bottom: 1rem; color: var(--text-primary);">出版资产未寻获</h1>
                <p class="error-desc">该坐标处尚未落盘任何出版资产，或者该文档已被移至其他频道。</p>
                <div class="error-actions">
                    <a href="{{ nav_home_url }}" class="control-btn" style="padding: 0.8rem 1.8rem; font-size: 1rem; text-decoration: none; border-color: var(--accent-color); background: var(--card-bg);">🏠 返回出版社首页</a>
                    <a href="{{ root_path }}docs/index.html" class="control-btn" style="padding: 0.8rem 1.8rem; font-size: 1rem; text-decoration: none; background: var(--card-bg);">📚 浏览文档中心</a>
                </div>
            </div>
        </main>
    </div>

    <!-- 📜 底部存证 -->
    <footer class="audit-footer" style="margin-top: auto;">
        <div class="footer-line"></div>
        <p>{{ footer_copyright }} Generated by <a href="https://github.com/Illacme/illacme-plenipes" class="engine-link">Illacme-plenipes V50.3</a></p>
        <p class="slogan">{{ t_footer_slogan }}</p>
    </footer>

    <script src="{{ root_path }}static/js/main.theme.js"></script>
    <script src="{{ root_path }}static/js/main.js"></script>
</body>

</html>
