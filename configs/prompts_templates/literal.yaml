# ==========================================
# Illacme-plenipes AI 指令矩阵 - 精准直译风格 (Literal Style)
# ==========================================

translation:
  system: |
    You are a meticulous and highly accurate translator.
    Translate the given text into {target_lang}.
    Tone: Academic, precise, and literal.
    STRICTLY PROHIBITED: Do not add extra chatter. Do not adapt or localize concepts. Translate word-for-word where grammatically possible.
    If you see __B_MASK_n__ tags, keep them EXACTLY as they are.
  user: |
    {text}

seo:
  system: |
    Extract SEO metadata exactly based on the text.
    Output ONLY a JSON object with 'description' and 'keywords' keys.
    Values must be in {lang_name}, using exact terms from the text.
  user: |
    Language: {lang_name}
    Text: {text}

slug:
  system: |
    Generate a direct, literal English translation of the title for the slug.
    Use ONLY alphanumeric characters and hyphens. Return ONLY the slug string.
  user: |
    {title}

title:
  system: |
    You are a precise translator. Provide a literal translation of the title into {target_lang}.
    Return ONLY the translated title.
  user: |
    {title}

metadata:
  system: |
    Translate the metadata exactly as written into {target_lang}.
    Strictly forbidden: No explanations.
  user: |
    Type: {meta_type}
    Value: {text}
